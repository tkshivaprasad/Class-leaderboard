name: Update leaderboard

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab
  push:
    paths: [students.csv, update.py]

permissions:
  contents: write

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect student activity
        env:
          # Use a personal access token (secret LEADERBOARD_TOKEN) to read students'
          # private assignment repos; otherwise the built-in token is used.
          GITHUB_TOKEN: ${{ secrets.LEADERBOARD_TOKEN || secrets.GITHUB_TOKEN }}
        run: python update.py
      - name: Save data.json
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update leaderboard data"
          # If a student joined while this ran, merge our results into the newest copy.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push -q; then echo "Saved"; exit 0; fi
            echo "Newer data exists, merging ($attempt)"
            sleep $(( (RANDOM % 8) + 2 ))
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python update.py --merge /tmp/leaderboard_rows.json
            git add data.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Update leaderboard data"
          done
          exit 1
