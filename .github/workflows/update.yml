name: Update leaderboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: [students.csv, update.py]

permissions:
  contents: write

concurrency:
  group: leaderboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect student activity
        env:
          GITHUB_TOKEN: ${{ secrets.LEADERBOARD_TOKEN || secrets.GITHUB_TOKEN }}
        run: python update.py
      - name: Save data.json
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update leaderboard data"
          git pull --rebase
          git push
