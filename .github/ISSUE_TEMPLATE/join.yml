name: Join the leaderboard
description: Add yourself to the class leaderboard
title: "Join: "
labels: [join]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and click **Submit new issue**. You'll be added automatically
        (or once your teacher approves), and this issue will close with a confirmation.
        Your GitHub username is taken from your account, so you don't need to type it.

        **Keep your programs in a public repository named `class-programs`.** Only that repo counts.
  - type: input
    id: name
    attributes:
      label: Your full name
      description: As it should appear on the leaderboard
      placeholder: Aarav Sharma
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Assignment repo (optional)
      description: "Leave this EMPTY. The leaderboard tracks your public repo named class-programs. Only fill this in if your teacher tells you to use a different repo (format: owner/repo-name)."
      placeholder: leave empty
    validations:
      required: false
